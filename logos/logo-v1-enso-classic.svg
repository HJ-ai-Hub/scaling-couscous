<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 530" width="500" height="530">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
    ]]></style>
  </defs>

  <rect width="500" height="530" fill="#F5F1E6"/>

  <!-- ════════════════════════════════════════
       ENSO BRUSHSTROKE CIRCLE
       Clockwise from 1-o'clock to 11-o'clock
       Gap at top — classic Zen opening
       ════════════════════════════════════════ -->
  <path d="
    M 318,82
    C 378,108 394,170 385,232
    C 376,296 338,346 282,365
    C 226,384 168,365 130,326
    C 92,288 82,238 92,190
    C 102,142 130,106 168,86
    C 192,74 218,70 246,70"
    fill="none" stroke="#2C2C2C" stroke-width="20" stroke-linecap="round"/>

  <!-- ════════════════════════════════════════
       RED SUN — partially behind mountains
       ════════════════════════════════════════ -->
  <circle cx="285" cy="128" r="32" fill="#8B0000"/>

  <!-- ════════════════════════════════════════
       MOUNTAIN SILHOUETTES
       ════════════════════════════════════════ -->
  <polygon points="162,228 220,170 278,228" fill="#8B8680" opacity="0.55"/>
  <polygon points="226,228 275,180 332,228" fill="#8B8680" opacity="0.8"/>

  <!-- ════════════════════════════════════════
       JAPANESE DOJO HOUSE
       ════════════════════════════════════════ -->
  <!-- Main roof -->
  <polygon points="172,224 250,148 328,224" fill="#2C2C2C"/>
  <!-- Subtle secondary eave shadow -->
  <polygon points="184,224 250,162 316,224" fill="#1a1a1a"/>
  <!-- Walls -->
  <rect x="194" y="224" width="112" height="52" fill="#2C2C2C"/>
  <!-- Shoji horizontal rail -->
  <line x1="194" y1="246" x2="306" y2="246" stroke="#F5F1E6" stroke-width="1" opacity="0.3"/>
  <!-- Shoji vertical divisions -->
  <line x1="222" y1="224" x2="222" y2="276" stroke="#F5F1E6" stroke-width="0.9" opacity="0.28"/>
  <line x1="250" y1="224" x2="250" y2="276" stroke="#F5F1E6" stroke-width="0.9" opacity="0.28"/>
  <line x1="278" y1="224" x2="278" y2="276" stroke="#F5F1E6" stroke-width="0.9" opacity="0.28"/>
  <!-- Ground line -->
  <line x1="152" y1="276" x2="348" y2="276" stroke="#2C2C2C" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════
       PINE TREE — left, overlapping circle edge
       ════════════════════════════════════════ -->
  <rect x="116" y="258" width="6" height="22" fill="#2C2C2C"/>
  <polygon points="93,268 119,244 145,268" fill="#2C2C2C"/>
  <polygon points="99,254 119,232 139,254" fill="#2C2C2C"/>
  <polygon points="107,241 119,220 131,241" fill="#2C2C2C"/>

  <!-- ════════════════════════════════════════
       RED HANKO SEAL STAMP
       ════════════════════════════════════════ -->
  <rect x="314" y="286" width="18" height="18" rx="1" fill="#8B0000"/>
  <text x="323" y="299" text-anchor="middle"
    font-family="serif" font-size="9" fill="#F5F1E6">鶴</text>

  <!-- ════════════════════════════════════════
       WORDMARK
       ════════════════════════════════════════ -->
  <line x1="85" y1="352" x2="415" y2="352" stroke="#8B0000" stroke-width="0.8"/>

  <text x="250" y="396"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="46" font-weight="700"
    fill="#8B0000" letter-spacing="9">ORIZURU</text>

  <text x="250" y="424"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="13" fill="#2C2C2C" letter-spacing="8">HOLIDAY HOMES</text>

  <line x1="185" y1="442" x2="315" y2="442" stroke="#8B8680" stroke-width="0.6"/>

  <text x="250" y="462"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="9" fill="#8B8680" letter-spacing="4">STAY . RELAX . EXPERIENCE</text>
</svg>
