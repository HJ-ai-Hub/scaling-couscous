<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orizuru Holiday Homes — Logo Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Serif+JP&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #2C2C2C;
      font-family: 'Playfair Display', Georgia, serif;
      padding: 60px 40px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 64px;
    }
    header h1 {
      font-size: 13px;
      letter-spacing: 10px;
      color: #8B8680;
      font-weight: 400;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    header p {
      font-size: 11px;
      letter-spacing: 4px;
      color: #5a5552;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      max-width: 1360px;
      margin: 0 auto;
    }

    .card {
      background: #F5F1E6;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      width: 100%;
      padding: 14px 0 12px;
      text-align: center;
      border-top: 1px solid #8B0000;
      margin-top: 0;
    }
    .label span {
      font-size: 10px;
      letter-spacing: 6px;
      color: #8B8680;
      text-transform: uppercase;
      font-weight: 400;
    }

    .card svg {
      width: 100%;
      height: auto;
    }

    /* ── Inline SVG font overrides ── */
    .card text {
      font-family: 'Playfair Display', Georgia, serif !important;
    }

    footer {
      text-align: center;
      margin-top: 64px;
    }
    footer p {
      font-size: 10px;
      letter-spacing: 5px;
      color: #3a3836;
      text-transform: uppercase;
    }
  </style>
</head>

</header>
